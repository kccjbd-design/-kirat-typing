<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Kirat Typing Lab</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .display-area { font-size: 24px; padding: 15px; background: #eee; min-height: 100px; margin-bottom: 10px; border-radius: 5px; }
        textarea { width: 100%; height: 150px; font-size: 24px; padding: 10px; box-sizing: border-box; }
        #modal { display: none; position: fixed; top: 0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 80%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⌨️ Kirat Typing Lab</h1>
        <select id="lang" onchange="loadLesson()">
            <option value="Punjabi">Punjabi</option>
            <option value="English">English</option>
        </select>
        <select id="cat" onchange="loadLesson()">
            <option value="Characters">Characters</option>
            <option value="Chunks">Chunks</option>
            <option value="Paragraphs">Paragraphs</option>
        </select>
        <select id="lessonSelect" onchange="loadLesson()"></select>
        
        <div id="display" class="display-area"></div>
        <textarea id="input" oninput="startTimer()"></textarea>
        <button onclick="submitTest()" style="width:100%; padding:15px; margin-top:10px;">Submit Test</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2>Result Report</h2>
            <p id="resAccuracy"></p>
            <p><strong>Original:</strong> <span id="resOrig"></span></p>
            <p><strong>Your Input:</strong> <span id="resTyped"></span></p>
            <button onclick="document.getElementById('modal').style.display='none'">Close</button>
        </div>
    </div>

    <script>
        let data = {
            "Punjabi": {
                "Characters": [{name:"L1", text:"ਕ ਮ ਜ ਲ"}],
                "Chunks": [{name:"C1", text:"ਇਹ ਇੱਕ ਚੰਕ ਹੈ"}],
                "Paragraphs": [{name:"P1", text:"ਪੰਜਾਬੀ ਟਾਈਪਿੰਗ ਦਾ ਪਹਿਰਾ।"}]
            },
            "English": {
                "Characters": [{name:"L1", text:"a s d f"}],
                "Chunks": [{name:"C1", text:"quick brown fox"}],
                "Paragraphs": [{name:"P1", text:"Typing is good."}]
            }
        };

        function loadLesson() {
            let l = document.getElementById("lang").value;
            let c = document.getElementById("cat").value;
            let s = document.getElementById("lessonSelect");
            let lessons = data[l][c];
            s.innerHTML = "";
            lessons.forEach((item, i) => {
                s.innerHTML += `<option value="${i}">${item.name}</option>`;
            });
            document.getElementById("display").innerText = lessons[0].text;
        }

        function submitTest() {
            let orig = document.getElementById("display").innerText.split(" ");
            let typed = document.getElementById("input").value.split(" ");
            let correct = 0;
            let resTypedHtml = "";

            orig.forEach((word, i) => {
                if(typed[i] === word) {
                    correct++;
                    resTypedHtml += word + " ";
                } else {
                    resTypedHtml += `<span style="color:red">${typed[i] || ""}</span> `;
                }
            });

            let acc = Math.round((correct / orig.length) * 100);
            document.getElementById("resAccuracy").innerText = "Accuracy: " + acc + "%";
            document.getElementById("resOrig").innerText = orig.join(" ");
            document.getElementById("resTyped").innerHTML = resTypedHtml;
            document.getElementById("modal").style.display = "block";

            // 98% logic
            if(document.getElementById("cat").value === "Characters" && acc >= 98) {
                alert("Congratulations! Next level unlocked.");
            }
        }
        window.onload = loadLesson;
    </script>
</body>
</html>
