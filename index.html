<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirat Typing & Steno Lab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        .nav { background: #333; padding: 15px; text-align: center; }
        .nav button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin: 0 10px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav button:hover { background: #45a049; }
        
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        h3 { color: #555; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-top: 25px; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        select, button, input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        
        /* Audio Player / URL Section */
        #audioContainer { text-align: center; margin-bottom: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; display: none; }
        #audioPlayer { width: 100%; max-width: 600px; outline: none; }
        .audio-link-btn { background: #17a2b8; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .audio-link-btn:hover { background: #138496; }

        #displayBox { background: #fdfdfd; padding: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 18px; line-height: 1.8; max-height: 250px; overflow-y: auto; margin-bottom: 15px; text-align: justify; user-select: none; }
        textarea { width: 100%; height: 200px; font-size: 18px; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #aaa; resize: vertical; }
        
        .btn-submit { background: #007BFF; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; padding: 12px; font-size: 18px; border-radius: 5px; }
        .btn-submit:hover { background: #0056b3; }

        /* Admin Panel Styles */
        #adminPanel { display: none; }
        .admin-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eaeaea; }
        .admin-form textarea { height: 120px; }
        .btn-save { background: #28a745; color: white; border: none; cursor: pointer; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 5px; }
        .btn-save:hover { background: #218838; }
        .btn-cancel { background: #6c757d; color: white; border: none; cursor: pointer; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 5px; display: none; }

        /* Lesson List Styles */
        .lesson-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 15px; }
        .lesson-table th, .lesson-table td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        .lesson-table th { background-color: #f2f2f2; color: #333; }
        .lesson-table tr:hover { background-color: #f5f5f5; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-edit { background: #ffc107; color: black; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-edit:hover { background: #e0a800; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background: #c82333; }

        /* Result Colors */
        .res-correct { color: green; font-weight: bold; }
        .res-wrong { color: red; font-weight: bold; text-decoration: underline; }
        .res-missing { background: yellow; color: black; font-weight: bold; padding: 0 4px; border-radius: 3px; }
        .res-extra { color: blue; font-weight: bold; background: #e0f7fa; padding: 0 4px; border-radius: 3px; }

        /* Modal Styles */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; }
        .modal-content { background: white; margin: 3% auto; padding: 25px; width: 90%; max-width: 1000px; max-height: 90vh; overflow-y: auto; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close-btn { background: #d9534f; color: white; padding: 8px 15px; border: none; cursor: pointer; float: right; font-size: 16px; border-radius: 5px; font-weight: bold; }
        .close-btn:hover { background: #c9302c; }
    </style>
</head>
<body>

<div class="nav">
    <button onclick="switchView('student')">Student Panel</button>
    <button onclick="switchView('admin')">Admin Panel</button>
</div>

<!-- STUDENT PANEL -->
<div class="container" id="studentPanel">
    <h2>⌨️ Kirat Typing & Steno Lab</h2>
    
    <div class="controls">
        <select id="testType" onchange="updateLanguages('student')">
            <option value="Typing">Typing</option>
            <option value="Steno">Shorthand (Steno)</option>
        </select>
        <select id="testLang" onchange="loadLessons()"></select>
        <select id="testLesson" onchange="displayLessonText()"></select>
    </div>

    <!-- Audio Player Section for Steno -->
    <div id="audioContainer">
        <audio id="audioPlayer" controls style="display:none;"></audio>
        <a id="audioLinkBtn" class="audio-link-btn" href="#" target="_blank" style="display:none;">🔊 Open Recording URL</a>
    </div>

    <div id="displayBox">ਕਿਰਪਾ ਕਰਕੇ ਉੱਪਰੋਂ ਟੈਸਟ ਚੁਣੋ...</div>
    <textarea id="inputBox" placeholder="ਆਪਣਾ ਟੈਕਸਟ ਇੱਥੇ ਟਾਈਪ ਕਰੋ..." autocomplete="off" spellcheck="false"></textarea>
    <button class="btn-submit" onclick="submitTest()">Submit Test</button>
</div>

<!-- ADMIN PANEL -->
<div class="container" id="adminPanel">
    <h2>⚙️ Admin Panel - Manage Lessons</h2>
    
    <div class="admin-form">
        <strong id="formTitle" style="font-size: 18px; color: #333;">Add New Lesson (ਨਵਾਂ ਪੈਰਾ ਜੋੜੋ)</strong>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="adminType" onchange="updateLanguages('admin')">
                <option value="Typing">Typing</option>
                <option value="Steno">Shorthand (Steno)</option>
            </select>
            <select id="adminLang" onchange="loadAdminLessons()"></select>
            <input type="text" id="adminLessonName" placeholder="Lesson Name (ਪੈਰੇ ਦਾ ਨਾਮ)" style="flex: 1; min-width: 200px;">
        </div>
        
        <!-- NEW FIELD: Audio/Recording URL -->
        <input type="text" id="adminAudioUrl" placeholder="Recording URL (ਲਿੰਕ) - Optional (e.g. YouTube, MP3 link)" style="width: 100%; box-sizing: border-box;">
        
        <textarea id="adminLessonText" placeholder="ਪੈਰੇ ਦਾ ਟੈਕਸਟ ਇੱਥੇ ਪੇਸਟ ਕਰੋ..."></textarea>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn-save" id="btnSaveLesson" onclick="saveLesson()" style="flex: 1;">Save Lesson</button>
            <button class="btn-cancel" id="btnCancelEdit" onclick="cancelEdit()">Cancel Edit</button>
        </div>
    </div>
    <p id="adminMsg" style="color: green; text-align: center; font-weight: bold; margin: 10px 0; min-height: 20px;"></p>

    <h3>📋 Existing Lessons List (ਮੌਜੂਦਾ ਪੈਰਿਆਂ ਦੀ ਸੂਚੀ)</h3>
    <div style="overflow-x: auto;">
        <table class="lesson-table">
            <thead>
                <tr>
                    <th style="width: 15%;">Name</th>
                    <th style="width: 15%;">Recording Link</th>
                    <th style="width: 50%;">Preview Text</th>
                    <th style="width: 20%;">Actions</th>
                </tr>
            </thead>
            <tbody id="adminLessonsList">
                <!-- Lessons dynamic load -->
            </tbody>
        </table>
    </div>
</div>

<!-- RESULT MODAL -->
<div id="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">Close</button>
        <h2>📊 Result Report</h2>
        <div id="resAccuracy"></div>
        <hr>
        <div id="resDisplay" style="line-height: 2.2; font-size: 18px; text-align: justify;"></div>
    </div>
</div>

<script>
    // 1. Database Initialization
    let defaultData = {
        "Typing": { "Punjabi": [], "English": [], "Hindi": [] },
        "Steno": { "Punjabi": [], "English": [] }
    };

    let db = JSON.parse(localStorage.getItem('kiratDB'));
    if (!db || !db["Typing"] || !db["Steno"]) {
        db = defaultData;
        db["Typing"]["Punjabi"].push({ name: "Demo Lesson 1", text: "ਸਲੀਕੇ ਤੋਂ ਭਾਵ ਕਿਸੇ ਕੰਮ ਨੂੰ ਕਰਨ ਜਾਂ ਜੀਵਨ ਵਿੱਚ ਵਿਚਰਨ ਦਾ ਅਜਿਹਾ ਸੁਚੱਜ ਹੈ ਜਿਸ ਨਾਲ ਕੰਮ ਕਰਨ ਵਿੱਚ ਅਸਾਨੀ ਹੋਵੇ।", audioUrl: "" });
        localStorage.setItem('kiratDB', JSON.stringify(db));
    }

    let editIndex = -1;

    // 2. View Switching
    function switchView(view) {
        document.getElementById('studentPanel').style.display = view === 'student' ? 'block' : 'none';
        document.getElementById('adminPanel').style.display = view === 'admin' ? 'block' : 'none';
        cancelEdit(); 
        if(view === 'student') { updateLanguages('student'); }
        else { updateLanguages('admin'); }
    }

    function updateLanguages(panel) {
        let typeVal = document.getElementById(panel === 'student' ? 'testType' : 'adminType').value;
        let langSelect = document.getElementById(panel === 'student' ? 'testLang' : 'adminLang');
        
        langSelect.innerHTML = "";
        let langs = Object.keys(db[typeVal]);
        
        langs.forEach(lang => {
            let opt = document.createElement("option");
            opt.value = lang; opt.textContent = lang;
            langSelect.appendChild(opt);
        });

        if(panel === 'student') { loadLessons(); }
        else { cancelEdit(); loadAdminLessons(); }
    }

    // 3. STUDENT PANEL: Load Lessons
    function loadLessons() {
        let type = document.getElementById('testType').value;
        let lang = document.getElementById('testLang').value;
        let lessonSelect = document.getElementById('testLesson');
        
        lessonSelect.innerHTML = "";
        let lessons = db[type][lang] || [];

        if(lessons.length === 0) {
            lessonSelect.innerHTML = "<option value=''>No lessons found</option>";
            document.getElementById('displayBox').innerText = "ਕੋਈ ਪੈਰਾ ਨਹੀਂ ਮਿਲਿਆ।";
            document.getElementById('audioContainer').style.display = "none";
            return;
        }

        lessons.forEach((les, index) => {
            let opt = document.createElement("option");
            opt.value = index; opt.textContent = les.name;
            lessonSelect.appendChild(opt);
        });
        displayLessonText();
    }

    function displayLessonText() {
        let type = document.getElementById('testType').value;
        let lang = document.getElementById('testLang').value;
        let index = document.getElementById('testLesson').value;
        
        let audioContainer = document.getElementById('audioContainer');
        let audioPlayer = document.getElementById('audioPlayer');
        let audioLinkBtn = document.getElementById('audioLinkBtn');

        if(index !== "" && db[type] && db[type][lang] && db[type][lang][index]) {
            let lesson = db[type][lang][index];
            document.getElementById('displayBox').innerText = lesson.text;
            document.getElementById('inputBox').value = "";
            
            // Handle Audio URL playback
            if(lesson.audioUrl && lesson.audioUrl.trim() !== "") {
                audioContainer.style.display = "block";
                let url = lesson.audioUrl.trim();
                
                // If it's a direct audio file (.mp3, .wav)
                if(url.endsWith('.mp3') || url.endsWith('.wav') || url.endsWith('.ogg')) {
                    audioPlayer.src = url;
                    audioPlayer.style.display = "inline-block";
                    audioLinkBtn.style.display = "none";
                } else {
                    // If it's a YouTube link or Google Drive link
                    audioPlayer.style.display = "none";
                    audioPlayer.src = "";
                    audioLinkBtn.href = url;
                    audioLinkBtn.style.display = "inline-block";
                }
            } else {
                audioContainer.style.display = "none";
            }
        }
    }

    // 4. ADMIN PANEL: Load List
    function loadAdminLessons() {
        let type = document.getElementById('adminType').value;
        let lang = document.getElementById('adminLang').value;
        let listContainer = document.getElementById('adminLessonsList');
        
        listContainer.innerHTML = "";
        let lessons = db[type][lang] || [];

        if(lessons.length === 0) {
            listContainer.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">ਇਸ ਕੈਟੇਗਰੀ ਵਿੱਚ ਕੋਈ ਪੈਰਾ ਨਹੀਂ ਹੈ।</td></tr>`;
            return;
        }

        lessons.forEach((les, index) => {
            let tr = document.createElement('tr');
            let previewText = les.text.length > 70 ? les.text.substring(0, 70) + "..." : les.text;
            let urlText = les.audioUrl ? `<a href="${les.audioUrl}" target="_blank">🔗 Link</a>` : `<span style="color:#aaa;">No Link</span>`;

            tr.innerHTML = `
                <td style="font-weight:bold; color:#333;">${les.name}</td>
                <td>${urlText}</td>
                <td style="color:#666; font-size:14px;">${previewText}</td>
                <td>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editLesson(${index})">✏️ Edit</button>
                        <button class="btn-delete" onclick="deleteLesson(${index})">🗑️ Delete</button>
                    </div>
                </td>
            `;
            listContainer.appendChild(tr);
        });
    }

    // 5. ADMIN PANEL: Add / Update Lesson
    function saveLesson() {
        let type = document.getElementById('adminType').value;
        let lang = document.getElementById('adminLang').value;
        let name = document.getElementById('adminLessonName').value.trim();
        let audioUrl = document.getElementById('adminAudioUrl').value.trim();
        let text = document.getElementById('adminLessonText').value.trim();

        if(!name || !text) { alert("Lesson Name ਅਤੇ Text ਦੋਵੇਂ ਭਰਨੇ ਲਾਜ਼ਮੀ ਹਨ!"); return; }

        if(editIndex === -1) {
            // New Entry
            db[type][lang].push({ name: name, audioUrl: audioUrl, text: text });
            showAdminMessage("Lesson Saved Successfully! ✅");
        } else {
            // Update Entry
            db[type][lang][editIndex] = { name: name, audioUrl: audioUrl, text: text };
            showAdminMessage("Lesson Updated Successfully! 🔄");
            cancelEdit();
        }

        localStorage.setItem('kiratDB', JSON.stringify(db));
        
        // Reset inputs
        document.getElementById('adminLessonName').value = "";
        document.getElementById('adminAudioUrl').value = "";
        document.getElementById('adminLessonText').value = "";
        
        loadAdminLessons();
    }

    // 6. ADMIN PANEL: Edit & Delete Functions
    function editLesson(index) {
        let type = document.getElementById('adminType').value;
        let lang = document.getElementById('adminLang').value;
        let lesson = db[type][lang][index];

        if(!lesson) return;

        editIndex = index;
        document.getElementById('adminLessonName').value = lesson.name;
        document.getElementById('adminAudioUrl').value = lesson.audioUrl || "";
        document.getElementById('adminLessonText').value = lesson.text;
        
        document.getElementById('formTitle').innerText = "✏️ Edit Mode - Update Lesson";
        document.getElementById('btnSaveLesson').innerText = "Update Lesson";
        document.getElementById('btnSaveLesson').style.background = "#ffc107";
        document.getElementById('btnSaveLesson').style.color = "black";
        document.getElementById('btnCancelEdit').style.display = "inline-block";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editIndex = -1;
        document.getElementById('adminLessonName').value = "";
        document.getElementById('adminAudioUrl').value = "";
        document.getElementById('adminLessonText').value = "";
        document.getElementById('formTitle').innerText = "Add New Lesson (ਨਵਾਂ ਪੈਰਾ ਜੋੜੋ)";
        document.getElementById('btnSaveLesson').innerText = "Save Lesson";
        document.getElementById('btnSaveLesson').style.background = "#28a745";
        document.getElementById('btnSaveLesson').style.color = "white";
        document.getElementById('btnCancelEdit').style.display = "none";
    }

    function deleteLesson(index) {
        let type = document.getElementById('adminType').value;
        let lang = document.getElementById('adminLang').value;
        let lessonName = db[type][lang][index].name;

        if(confirm(`ਕੀ ਤੁਸੀਂ ਪੱਕਾ "${lessonName}" ਨੂੰ ਡਿਲੀਟ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?`)) {
            db[type][lang].splice(index, 1);
            localStorage.setItem('kiratDB', JSON.stringify(db));
            showAdminMessage("Lesson Deleted! 🗑️");
            cancelEdit();
            loadAdminLessons();
        }
    }

    function showAdminMessage(msg) {
        let p = document.getElementById('adminMsg');
        p.innerText = msg;
        setTimeout(() => p.innerText = "", 3000);
    }

    // 7. RESULT CHECKING ALGORITHM
    function submitTest() {
        let type = document.getElementById('testType').value;
        let lang = document.getElementById('testLang').value;
        let index = document.getElementById('testLesson').value;

        if(index === "" || !db[type][lang][index]) { alert("ਕਿਰਪਾ ਕਰਕੇ ਪਹਿਲਾਂ ਕੋਈ ਲੈਸਨ ਚੁਣੋ!"); return; }

        // Stop audio if playing
        let ap = document.getElementById('audioPlayer');
        if(ap) ap.pause();

        let origText = db[type][lang][index].text;
        let typedText = document.getElementById('inputBox').value;

        let origWords = origText.trim().split(/\s+/);
        let typedWords = typedText.trim().split(/\s+/);
        if (typedText.trim() === "") typedWords = [];

        let html = "";
        let stats = { correct: 0, wrong: 0, missing: 0, extra: 0 };
        let o = 0; let t = 0; 

        while (o < origWords.length || t < typedWords.length) {
            if (o < origWords.length && t < typedWords.length && origWords[o] === typedWords[t]) {
                html += `<span class="res-correct">${typedWords[t]}</span> `;
                stats.correct++;
                o++; t++;
            } 
            else if (o >= origWords.length) {
                html += `<span class="res-extra">${typedWords[t]}</span> `;
                stats.extra++;
                t++;
            } 
            else if (t >= typedWords.length) {
                html += `<span class="res-missing">${origWords[o]}</span> `;
                stats.missing++;
                o++;
            } 
            else {
                let windowSize = 8; 
                let matchInOrig = -1;
                let matchInTyped = -1;

                for (let i = 1; i <= windowSize && o + i < origWords.length; i++) {
                    if (origWords[o + i] === typedWords[t]) { matchInOrig = i; break; }
                }
                for (let j = 1; j <= windowSize && t + j < typedWords.length; j++) {
                    if (origWords[o] === typedWords[t + j]) { matchInTyped = j; break; }
                }

                if (matchInOrig !== -1 && (matchInTyped === -1 || matchInOrig < matchInTyped)) {
                    html += `<span class="res-missing">${origWords[o]}</span> `;
                    stats.missing++;
                    o++;
                } else if (matchInTyped !== -1 && (matchInOrig === -1 || matchInTyped <= matchInOrig)) {
                    html += `<span class="res-extra">${typedWords[t]}</span> `;
                    stats.extra++;
                    t++;
                } else {
                    html += `<span class="res-wrong">${typedWords[t]}</span> `;
                    stats.wrong++;
                    o++; t++;
                }
            }
        }

        let acc = Math.round((stats.correct / origWords.length) * 100);
        if (isNaN(acc) || acc < 0) acc = 0;

        document.getElementById("resAccuracy").innerHTML = `
            <div style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #ccc; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;">
                <div style="grid-column: 1 / -1;"><h3 style="margin:0; font-size: 22px;">Accuracy: <span style="color:${acc > 80 ? 'green' : 'red'};">${acc}%</span></h3></div>
                <div class="res-correct" style="font-size:18px;">✅ ਸਹੀ (Correct): <b>${stats.correct}</b></div>
                <div class="res-wrong" style="font-size:18px; text-decoration:none;">❌ ਗਲਤ (Wrong): <b>${stats.wrong}</b></div>
                <div class="res-missing" style="font-size:18px; display:inline-block; border-radius:4px;">⚠️ ਛੱਡੇ ਗਏ (Missing): <b>${stats.missing}</b></div>
                <div class="res-extra" style="font-size:18px; background:none; padding:0; color:blue;">➕ ਵਾਧੂ (Extra): <b>${stats.extra}</b></div>
            </div>
        `;
        
        document.getElementById("resDisplay").innerHTML = html;
        document.getElementById("modal").style.display = "block";
    }

    // Initialize Page
    window.onload = () => { switchView('student'); };
</script>
</body>
</html>
