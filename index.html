    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        .nav { background: #333; padding: 15px; text-align: center; }
        .nav button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin: 0 10px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav button:hover { background: #45a049; }
        
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        h3 { color: #555; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-top: 25px; }
        
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        select, button, input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        
        /* Audio Player / URL Section */
        #audioContainer { text-align: center; margin-bottom: 15px; padding: 10px; background: #e9ecef; border-radius: 5px; display: none; }
        #audioPlayer { width: 100%; max-width: 600px; outline: none; }
        .audio-link-btn { background: #17a2b8; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .audio-link-btn:hover { background: #138496; }

        #displayBox { background: #fdfdfd; padding: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 18px; line-height: 1.8; max-height: 250px; overflow-y: auto; margin-bottom: 15px; text-align: justify; user-select: none; }
        textarea { width: 100%; height: 200px; font-size: 18px; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #aaa; resize: vertical; }
        
        .btn-submit { background: #007BFF; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; padding: 12px; font-size: 18px; border-radius: 5px; }
        .btn-submit:hover { background: #0056b3; }

        /* Admin Panel Styles */
        #adminPanel { display: none; }
        .admin-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eaeaea; }
        .admin-form textarea { height: 120px; }
        .btn-save { background: #28a745; color: white; border: none; cursor: pointer; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 5px; }
        .btn-save:hover { background: #218838; }
        .btn-cancel { background: #6c757d; color: white; border: none; cursor: pointer; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 5px; display: none; }

        /* Lesson List Styles */
        .lesson-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 15px; }
        .lesson-table th, .lesson-table td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
        .lesson-table th { background-color: #f2f2f2; color: #333; }
        .lesson-table tr:hover { background-color: #f5f5f5; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
