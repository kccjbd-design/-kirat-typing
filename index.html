<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Kirat Typing & Steno Lab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; cursor: pointer; user-select: none; }
        .menu { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 12px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; background: #3498db; color: white; }
        .btn-active { background: #27ae60; }
        .display-area { font-size: 24px; padding: 20px; background: #fafafa; border: 2px solid #ddd; border-radius: 8px; min-height: 150px; margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; font-size: 20px; padding: 10px; border: 2px solid #3498db; border-radius: 8px; box-sizing: border-box; }
        #adminPanel { display: none; background: #fff3cd; padding: 20px; border: 2px dashed #e67e22; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 onclick="toggleAdmin()">⌨️ Kirat Typing & Steno Lab</h1>
        <div class="menu">
            <button id="typeBtn" class="btn-active" onclick="setMode('typing')">Typing Mode</button>
            <button id="stenoBtn" onclick="setMode('steno')">🎧 Steno Mode</button>
        </div>
        <div id="display" class="display-area">ਕੋਈ ਲੈਸਨ ਨਹੀਂ ਹੈ।</div>
        <textarea id="input" placeholder="ਇੱਥੇ ਟਾਈਪ ਕਰੋ..."></textarea>
    </div>
</body>
</html>
